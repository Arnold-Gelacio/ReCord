<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Record Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cloth: #2c4436;
    --cloth-dark: #1f3226;
    --paper: #f6f1e3;
    --paper-line: #c9d6c0;
    --margin-red: #a9463c;
    --ink: #26241c;
    --ink-soft: #5b5744;
    --gold: #b8934f;
    --ok: #4d7a53;
    --danger: #a9463c;
    --focus: #2c4436;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cloth: #16241b;
      --cloth-dark: #0d160f;
      --paper: #e7e0cc;
      --paper-line: #b7c4ac;
      --margin-red: #b6544a;
      --ink: #221f18;
      --ink-soft: #52503f;
      --gold: #c39f5c;
      --ok: #4d7a53;
      --danger: #b6544a;
      --focus: #16241b;
    }
  }
  :root[data-theme="dark"] {
    --cloth: #16241b;
    --cloth-dark: #0d160f;
    --paper: #e7e0cc;
    --paper-line: #b7c4ac;
    --margin-red: #b6544a;
    --ink: #221f18;
    --ink-soft: #52503f;
    --gold: #c39f5c;
    --ok: #4d7a53;
    --danger: #b6544a;
    --focus: #16241b;
  }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cloth);
    background-image:
      linear-gradient(180deg, var(--cloth) 0%, var(--cloth-dark) 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    min-height: 100%;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: calc(30px + env(safe-area-inset-top, 0px)) 18px calc(60px + env(safe-area-inset-bottom, 0px));
  }

  .spine {
    text-align: center;
    margin-bottom: 22px;
  }
  .spine h1 {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--paper);
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .spine p {
    color: var(--paper);
    opacity: 0.72;
    font-size: 0.88rem;
    margin: 0;
    max-width: 52ch;
    margin: 0 auto;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 20px 0 22px;
  }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    border: 1.5px solid var(--paper);
    background: transparent;
    color: var(--paper);
    padding: 9px 16px;
    border-radius: 2px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
  }
  .btn:hover { background: rgba(246,241,227,0.12); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--gold); color: var(--cloth-dark); border-color: var(--gold); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, .stat-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .file-input { display: none; }

  .banner {
    display: none;
    background: #f2ddd9;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 3px;
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .banner.show { display: block; }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--paper);
    opacity: 0.75;
    margin-bottom: 24px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(77,122,83,0.25); }
  .dot.offline { background: var(--danger); box-shadow: 0 0 0 3px rgba(169,70,60,0.25); }
  .dot.pending { background: #c9a24a; box-shadow: 0 0 0 3px rgba(201,162,74,0.25); }

  .book {
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 24px 50px -20px rgba(0,0,0,0.55);
    padding: 8px 0 4px;
    position: relative;
    overflow: hidden;
  }
  .book::before {
    content: "";
    position: absolute;
    left: 46px;
    top: 0; bottom: 0;
    width: 1.5px;
    background: var(--margin-red);
    opacity: 0.55;
  }
  @media (max-width: 620px) {
    .book::before { left: 30px; }
  }

  .col-heads {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 22px 10px 60px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--paper-line);
  }
  @media (max-width: 620px) { .col-heads { display: none; } }
  .col-heads .ch-name { flex: 1.4; min-width: 0; }
  .col-heads .ch-stat { width: 76px; text-align: center; }
  .col-heads .ch-note { flex: 1.2; min-width: 0; }

  .lines { display: flex; flex-direction: column; }

  .line {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px 13px 60px;
    border-bottom: 1px solid var(--paper-line);
    flex-wrap: wrap;
  }
  .line:last-child { border-bottom: none; }
  .line .no {
    position: absolute;
    left: 0; width: 46px;
    text-align: right;
    padding-right: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    opacity: 0.6;
  }
  @media (max-width: 620px) {
    .line { padding-left: 44px; }
    .line .no { width: 30px; padding-right: 8px; }
  }

  .name-wrap { flex: 1.4 1 160px; min-width: 140px; display: flex; align-items: baseline; gap: 6px; }
  .name-field {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 1rem;
    background: transparent;
    border: none;
    color: var(--ink);
    width: 100%;
    padding: 2px 0;
    border-bottom: 1px dotted transparent;
  }
  .name-field:focus { outline: none; border-bottom-color: var(--ink-soft); }

  .stat-block { display: flex; flex-direction: column; align-items: center; width: 76px; flex: 0 0 auto; }
  .stat-block .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 3px;
    display: none;
  }
  @media (max-width: 620px) { .stat-block .stat-label { display: block; } }
  .stat-controls { display: flex; align-items: center; gap: 4px; }
  .stat-btn {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--ink-soft);
    background: transparent;
    color: var(--ink);
    font-size: 0.82rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .stat-btn:active { transform: translateY(1px); }
  .stat-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .stat-value {
    width: 26px; text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600; font-size: 0.86rem;
    background: transparent; border: none; color: var(--ink);
  }
  .stat-value:focus { outline: none; text-decoration: underline dashed; }

  .note-wrap { flex: 1.2 1 140px; min-width: 120px; }
  .notes-field {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    width: 100%;
    padding: 2px 0;
  }
  .notes-field:focus { outline: none; }
  .notes-field::placeholder { color: var(--ink-soft); opacity: 0.5; }

  .line-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .updated {
    font-size: 0.62rem;
    color: var(--ink-soft);
    opacity: 0.7;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
  }
  @media (max-width: 780px) { .updated { display: none; } }
  .remove-x {
    background: none; border: none; color: var(--ink-soft);
    font-size: 0.95rem; line-height: 1; padding: 2px 4px; opacity: 0.45;
  }
  .remove-x:hover { opacity: 1; color: var(--danger); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    color: var(--ink);
    font-size: 1.15rem;
    margin: 0 0 8px;
  }
  .empty p { margin: 0 0 18px; font-size: 0.88rem; }

  .foot-note {
    text-align: center;
    color: var(--paper);
    opacity: 0.55;
    font-size: 0.74rem;
    margin-top: 20px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 0.84rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <div class="spine">
    <h1>Class Record Book</h1>
    <p>Absences, recitation, activities, reports, and quizzes for every groupmate — synced with Firebase, kept even offline.</p>
  </div>

  <div class="toolbar">
    <button class="btn ghost" id="exportBtn" type="button">Export backup</button>
    <button class="btn ghost" id="importBtn" type="button">Import backup</button>
    <input type="file" id="fileInput" class="file-input" accept="application/json">
    <button class="btn primary" id="addBtn" type="button">+ Add groupmate</button>
  </div>

  <div class="banner" id="errorBanner"></div>

  <div class="status-row">
    <span class="dot" id="netDot"></span>
    <span id="netLabel">Connecting…</span>
  </div>

  <div class="book">
    <div class="col-heads">
      <span class="ch-name">Name</span>
      <span class="ch-stat">Absent</span>
      <span class="ch-stat">Recit.</span>
      <span class="ch-stat">Activity</span>
      <span class="ch-stat">Reports</span>
      <span class="ch-stat">Quizzes</span>
      <span class="ch-note">Note</span>
    </div>
    <div class="lines" id="lines"></div>
  </div>

  <p class="foot-note" id="countLabel"></p>

</div>

<div class="toast" id="toast"></div>

<script type="module">
(async function () {
  "use strict";

  var FIELDS = [
    { key: "absent", label: "Absent" },
    { key: "recitation", label: "Recit." },
    { key: "activity", label: "Activity" },
    { key: "reports", label: "Reports" },
    { key: "quizzes", label: "Quizzes" }
  ];

  var linesEl = document.getElementById("lines");
  var toastEl = document.getElementById("toast");
  var countLabel = document.getElementById("countLabel");
  var netDot = document.getElementById("netDot");
  var netLabel = document.getElementById("netLabel");
  var errorBanner = document.getElementById("errorBanner");
  var addBtn = document.getElementById("addBtn");
  var exportBtn = document.getElementById("exportBtn");
  var importBtn = document.getElementById("importBtn");
  var fileInput = document.getElementById("fileInput");

  var records = [];
  var db, colRef;
  var fs = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function showFatalError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add("show");
    netLabel.textContent = "Not connected to Firebase";
    netDot.className = "dot offline";
    addBtn.disabled = true;
    exportBtn.disabled = true;
    importBtn.disabled = true;
  }

  function formatUpdated(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    try {
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    } catch (e) {
      return d.toDateString();
    }
  }

  function clampNum(n) {
    n = Math.round(Number(n));
    if (isNaN(n)) n = 0;
    if (n < 0) n = 0;
    if (n > 999) n = 999;
    return n;
  }

  function render() {
    linesEl.innerHTML = "";
    countLabel.textContent = records.length ? records.length + (records.length === 1 ? " entry" : " entries") : "";

    if (!records.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = '<h2>No entries yet</h2><p>Add your first groupmate to open the book.</p>';
      var btn = document.createElement("button");
      btn.className = "btn primary";
      btn.type = "button";
      btn.textContent = "+ Add groupmate";
      btn.addEventListener("click", function () { addRecord(""); });
      empty.appendChild(btn);
      linesEl.appendChild(empty);
      return;
    }

    records.forEach(function (rec, i) { linesEl.appendChild(buildLine(rec, i + 1)); });
  }

  function focusNewest() {
    window.requestAnimationFrame(function () {
      var el = linesEl.querySelector(".name-field");
      if (el) { el.focus(); el.select(); }
    });
  }

  function buildLine(rec, lineNo) {
    var line = document.createElement("div");
    line.className = "line";
    line.dataset.id = rec.id;

    var no = document.createElement("span");
    no.className = "no";
    no.textContent = String(lineNo).padStart(2, "0");
    line.appendChild(no);

    var nameWrap = document.createElement("div");
    nameWrap.className = "name-wrap";
    var nameInput = document.createElement("input");
    nameInput.className = "name-field";
    nameInput.type = "text";
    nameInput.value = rec.name;
    nameInput.maxLength = 60;
    nameInput.setAttribute("aria-label", "Groupmate name");
    nameInput.addEventListener("change", function () {
      var val = nameInput.value.trim() || "Unnamed";
      nameInput.value = val;
      updateField(rec.id, { name: val });
    });
    nameWrap.appendChild(nameInput);
    line.appendChild(nameWrap);

    FIELDS.forEach(function (f) {
      var block = document.createElement("div");
      block.className = "stat-block";

      var label = document.createElement("span");
      label.className = "stat-label";
      label.textContent = f.label;
      block.appendChild(label);

      var controls = document.createElement("div");
      controls.className = "stat-controls";

      var minus = document.createElement("button");
      minus.className = "stat-btn";
      minus.type = "button";
      minus.textContent = "\u2212";
      minus.setAttribute("aria-label", "Decrease " + f.label + " for " + rec.name);

      var value = document.createElement("input");
      value.className = "stat-value";
      value.type = "number";
      value.inputMode = "numeric";
      value.min = "0";
      value.max = "999";
      value.value = rec[f.key];
      value.setAttribute("aria-label", f.label + " count for " + rec.name);

      var plus = document.createElement("button");
      plus.className = "stat-btn";
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "Increase " + f.label + " for " + rec.name);

      function commit(n) {
        var v = clampNum(n);
        value.value = v;
        var patch = {};
        patch[f.key] = v;
        updateField(rec.id, patch);
      }

      minus.addEventListener("click", function () { commit(rec[f.key] - 1); });
      plus.addEventListener("click", function () { commit(rec[f.key] + 1); });
      value.addEventListener("change", function () { commit(value.value); });

      controls.appendChild(minus);
      controls.appendChild(value);
      controls.appendChild(plus);
      block.appendChild(controls);
      line.appendChild(block);
    });

    var noteWrap = document.createElement("div");
    noteWrap.className = "note-wrap";
    var notes = document.createElement("input");
    notes.className = "notes-field";
    notes.type = "text";
    notes.placeholder = "note\u2026";
    notes.maxLength = 120;
    notes.value = rec.notes || "";
    notes.setAttribute("aria-label", "Note for " + rec.name);
    notes.addEventListener("change", function () { updateField(rec.id, { notes: notes.value }); });
    noteWrap.appendChild(notes);
    line.appendChild(noteWrap);

    var meta = document.createElement("div");
    meta.className = "line-meta";
    var updatedEl = document.createElement("span");
    updatedEl.className = "updated";
    updatedEl.textContent = formatUpdated(rec.updatedAt);
    meta.appendChild(updatedEl);

    var removeBtn = document.createElement("button");
    removeBtn.className = "remove-x";
    removeBtn.type = "button";
    removeBtn.setAttribute("aria-label", "Remove " + rec.name);
    removeBtn.textContent = "\u2715";
    removeBtn.addEventListener("click", function () { removeRecord(rec.id, rec.name); });
    meta.appendChild(removeBtn);

    line.appendChild(meta);
    return line;
  }

  // ---- Firebase wiring ----
  try {
    var appMod = await import("https://cdn.jsdelivr.net/npm/firebase@10.12.2/app/+esm");
    fs = await import("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firestore/+esm");

    var firebaseConfig = {
      apiKey: "AIzaSyAuOzv0qziypBWi1lRy1IvmqsE33IgP3As",
      authDomain: "record-8410a.firebaseapp.com",
      projectId: "record-8410a",
      storageBucket: "record-8410a.firebasestorage.app",
      messagingSenderId: "488552471318",
      appId: "1:488552471318:web:1ab8b425a3e21e179e8e37",
      measurementId: "G-PB96HJZJE7"
    };

    var app = appMod.initializeApp(firebaseConfig);
    db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    colRef = fs.collection(db, "groupmates");

    var q = fs.query(colRef, fs.orderBy("createdAt", "desc"));
    fs.onSnapshot(q, function (snapshot) {
      records = snapshot.docs.map(function (d) {
        var data = d.data();
        var rec = { id: d.id, name: data.name || "Unnamed", notes: data.notes || "", updatedAt: data.updatedAt || 0 };
        FIELDS.forEach(function (f) { rec[f.key] = clampNum(data[f.key] || 0); });
        return rec;
      });
      render();
      var fromCache = snapshot.metadata.fromCache;
      var hasPending = snapshot.metadata.hasPendingWrites;
      if (hasPending) {
        netDot.className = "dot pending";
        netLabel.textContent = "Saved on this device \u2014 syncing to Firebase\u2026";
      } else if (fromCache) {
        netDot.className = "dot offline";
        netLabel.textContent = "Offline \u2014 showing last synced data, edits are queued";
      } else {
        netDot.className = "dot";
        netLabel.textContent = "Synced with Firebase";
      }
    }, function (err) {
      console.error(err);
      showFatalError("Couldn't reach Firestore (" + err.code + "). Check your Firebase security rules and config, then reload.");
    });

  } catch (err) {
    console.error(err);
    showFatalError("Couldn't load Firebase. Check your connection and reload the page.");
    return;
  }

  function addRecord(name) {
    var ref = fs.doc(colRef);
    var data = { name: name || "New groupmate", notes: "", createdAt: Date.now(), updatedAt: Date.now() };
    FIELDS.forEach(function (f) { data[f.key] = 0; });
    fs.setDoc(ref, data).catch(function (err) {
      console.error(err);
      showToast("Couldn't save the new entry.");
    });
    focusNewest();
  }

  function updateField(id, patch) {
    patch.updatedAt = Date.now();
    fs.updateDoc(fs.doc(colRef, id), patch).catch(function (err) {
      console.error(err);
      showToast("Couldn't save that change \u2014 it will retry.");
    });
  }

  function removeRecord(id, name) {
    var ok = window.confirm('Remove "' + name + '"\u2019s entry? This can\u2019t be undone.');
    if (!ok) return;
    fs.deleteDoc(fs.doc(colRef, id)).then(function () {
      showToast("Removed " + name);
    }).catch(function (err) {
      console.error(err);
      showToast("Couldn't remove that entry.");
    });
  }

  function exportBackup() {
    try {
      var blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = "groupmate-records-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      showToast("Backup downloaded");
    } catch (err) {
      showToast("Couldn't create backup file.");
    }
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!Array.isArray(parsed)) throw new Error("bad format");
        var ok = window.confirm("Import " + parsed.length + " entr" + (parsed.length === 1 ? "y" : "ies") + "? This replaces everything currently in Firebase.");
        if (!ok) return;
        var batch = fs.writeBatch(db);
        records.forEach(function (r) { batch.delete(fs.doc(colRef, r.id)); });
        parsed.forEach(function (r) {
          var ref = fs.doc(colRef);
          var data = { name: String(r.name || "Unnamed"), notes: String(r.notes || ""), createdAt: Date.now(), updatedAt: Date.now() };
          FIELDS.forEach(function (f) { data[f.key] = clampNum(r[f.key] || 0); });
          batch.set(ref, data);
        });
        await batch.commit();
        showToast("Imported " + parsed.length + " entries");
      } catch (err) {
        console.error(err);
        showToast("That file doesn't look like a valid backup.");
      }
    };
    reader.onerror = function () { showToast("Couldn't read that file."); };
    reader.readAsText(file);
  }

  addBtn.addEventListener("click", function () { addRecord(""); });
  exportBtn.addEventListener("click", exportBackup);
  importBtn.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) importBackup(file);
    e.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
